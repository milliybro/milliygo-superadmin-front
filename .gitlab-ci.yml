stages:
  - build

build-job:
  stage: build
  only:
    - main
    #- merge_requests
  tags:
    - stage-server
  script:
    - cd /home/emehmon_superadmin_front
    - pwd
    - whoami
    - git checkout main || fail
    - git reset --hard origin/main || fail
    - git pull origin main || fail
    - npm install
    - npm run build